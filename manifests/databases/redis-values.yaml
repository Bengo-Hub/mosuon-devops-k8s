## Redis Helm values for mosuon (copied from devops-k8s)

global:
  redis:
    password: ""  # Leave empty, will be set via Helm --set or auto-generated

architecture: standalone

master:
  resources:
    requests:
      memory: "512Mi"
      cpu: "150m"
    limits:
      memory: "1536Mi"
      cpu: "500m"
  priorityClassName: db-critical

  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""

  configuration: |
    # Memory management
    maxmemory 1024mb
    maxmemory-policy allkeys-lru
    # Performance
    tcp-backlog 511
    timeout 0
    tcp-keepalive 300
    # Persistence
    save 900 1
    save 300 10
    save 60 10000
  
  livenessProbe:
    enabled: true
    initialDelaySeconds: 20
    periodSeconds: 5
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 5
  
  readinessProbe:
    enabled: true
    initialDelaySeconds: 20
    periodSeconds: 5
    timeoutSeconds: 1
    successThreshold: 1
    failureThreshold: 5

replica:
  replicaCount: 0
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"
  persistence:
    enabled: true
    size: 8Gi

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: infra
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

sentinel:
  enabled: false

networkPolicy:
  enabled: false
  allowExternal: false
