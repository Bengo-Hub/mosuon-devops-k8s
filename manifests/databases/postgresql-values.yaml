## Bitnami-style PostgreSQL Helm values for mosuon (copied/adjusted from devops-k8s)

global:
  postgresql:
    auth:
      postgresPassword: "" # Leave empty, will be auto-generated
      username: "admin_user"
      password: ""         # Leave empty, will be auto-generated
      database: "postgres"
  defaultFips: false
  security:
    allowInsecureImages: true

primary:
  image:
    registry: docker.io
    repository: codevertex/postgresql-pgvector
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "2Gi"
      cpu: "500m"
    limits:
      memory: "4Gi"
      cpu: "1500m"
  priorityClassName: db-critical
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  extendedConfiguration: |
    max_connections = 150
    shared_buffers = 512MB
    effective_cache_size = 1.5GB
    work_mem = 4MB
    maintenance_work_mem = 256MB
    checkpoint_completion_target = 0.9
    wal_buffers = 16MB
    default_statistics_target = 100
    random_page_cost = 1.1
    effective_io_concurrency = 150
    min_wal_size = 512MB
    max_wal_size = 2GB

readReplicas:
  replicaCount: 0
  image:
    registry: docker.io
    repository: codevertex/postgresql-pgvector
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  persistence:
    enabled: true
    size: 20Gi

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    namespace: infra
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

backup:
  enabled: false

networkPolicy:
  enabled: false
  allowExternal: false
